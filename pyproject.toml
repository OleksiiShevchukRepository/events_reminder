[project]
name = "reminder-bot"
version = "0.1.0"
description = "Telegram bot that sends scheduled messages at a set Kyiv time"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.22,<1",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reminder_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Translated text: Cyrillic letters aren't typos, and sentences read better unbroken.
"src/reminder_bot/i18n/uk.py" = ["RUF001", "E501"]
"tests/conftest.py" = ["ASYNC109"]
