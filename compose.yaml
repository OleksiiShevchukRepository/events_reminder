services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/reminders.db
      BACKUP_DIR: /data/backups
    volumes:
      - reminder-data:/data
    # Long enough for sends already in flight to finish.
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/data/heartbeat') > 60)"
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 30s

volumes:
  reminder-data:
